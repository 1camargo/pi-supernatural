<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<link
			rel="shortcut icon"
			href="../assets/icon/favicon2.ico"
			type="image/x-icon"
		/>
		<meta charset="UTF-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Poppins:wght@300;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="shortcut icon"
			href="./../assets/icon/favicon.ico"
			type="image/x-icon"
		/>
		<link rel="icon" href="./../assets/icon/favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="./../css/dashboards.css" />
		<script src="../js/sessao.js"></script>
		<script src="./../js/alerta.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<title>Portal dos Caçadores | Dashboard</title>
	</head>

	<body>
		<div class="janela">
			<div class="header-left">
				<h1>Portal dos Caçadores</h1>

				<div class="hello">
					<h3>Olá, <span id="usuario">usuário</span>!</h3>
				</div>

				<div class="btn-nav">
					<a href="../index.html">
						<h3>Início</h3>
					</a>
				</div>

				<div class="btn-nav">
					<h3>Gráficos</h3>
				</div>

				<div class="btn-nav-white">
					<a href="./mural.html">
						<h3>Mural de Relatos</h3>
					</a>
				</div>

				<div class="btn-logout" onclick="limparSessao()">
					<h3>Sair</h3>
				</div>
			</div>

			<div class="dash">
				<div id="kpis-container"></div>
				<br /><br /><br /><br />
				<div id="graficos"></div>
			</div>
		</div>
	</body>
</html>

<script>
	usuario.innerHTML = sessionStorage.NOME_USUARIO;

	window.onload = exibirGraficosRelatos;

	function exibirGraficosRelatos() {
		document.getElementById("graficos").innerHTML = `
			<div id="kpis-container"></div>
			<div class="graficos-container">
				<div class="grafico-container">
					<h3 class="tituloGraficos">Quantidade de Relatos por Tipo</h3>
					<div class="graph">
						<canvas id="graficoTipoRelato"></canvas>
					</div>
				</div>
				<div class="grafico-container">
					<h3 class="tituloGraficos">Relatos por Urgência</h3>
					<div class="graph">
						<canvas id="graficoUrgenciaRelato"></canvas>
					</div>
				</div>
			</div>
		`;

		obterDadosRelatos();
	}

	function obterDadosRelatos() {
		fetch(`/relatos/listar`, { cache: "no-store" })
			.then(function (response) {
				if (response.ok) {
					response.json().then(function (resposta) {
						exibirKPIs(resposta);
						plotarGraficoTipo(resposta);
						plotarGraficoUrgencia(resposta);
					});
				} else {
					console.error("Nenhum dado encontrado ou erro na API");
				}
			})
			.catch(function (error) {
				console.error(
					`Erro na obtenção dos dados p/ gráfico: ${error.message}`
				);
			});
	}

	function exibirKPIs(relatos) {
		const totalRelatos = relatos.length;

		let cidadesUnicas = [];
		let usuariosUnicos = [];

		for (let i = 0; i < relatos.length; i++) {
			const cidade = relatos[i].cidade;
			const usuario = relatos[i].idUsuario;

			if (cidadesUnicas.indexOf(cidade) === -1) {
				cidadesUnicas.push(cidade);
			}
			if (usuariosUnicos.indexOf(usuario) === -1) {
				usuariosUnicos.push(usuario);
			}
		}

		const totalEstados = cidadesUnicas.length;
		const totalUsuarios = usuariosUnicos.length;

		document.getElementById("kpis-container").innerHTML = `
			<div class="kpis">
				<div class="kpi">
					<span class="kpi-label">Total de Relatos</span>
					<span class="kpi-value">${totalRelatos}</span>
				</div>
				<div class="kpi">
					<span class="kpi-label">Estados Diferentes</span>
					<span class="kpi-value">${totalEstados}</span>
				</div>
				<div class="kpi">
					<span class="kpi-label">Usuários Diferentes</span>
					<span class="kpi-value">${totalUsuarios}</span>
				</div>
			</div>
		`;
	}

	function plotarGraficoTipo(relatos) {
		// Conta relatos por tipo
		const contagemPorTipo = {};
		relatos.forEach((item) => {
			const tipo = item.tipo;
			if (!contagemPorTipo[tipo]) {
				contagemPorTipo[tipo] = 0;
			}
			contagemPorTipo[tipo]++;
		});

		const labels = Object.keys(contagemPorTipo);
		const data = Object.values(contagemPorTipo);

		const dados = {
			labels: labels,
			datasets: [
				{
					label: "Quantidade de Relatos",
					data: data,
					backgroundColor: [
						'rgba(58, 58, 92, 0.85)',   
						'rgba(92, 34, 58, 0.85)',   
						'rgba(26, 26, 46, 0.85)',   
						'rgba(34, 40, 49, 0.85)',   
						'rgba(178, 0, 0, 0.85)',    
						'rgba(35, 37, 38, 0.85)'    
					],
					borderColor: [
						'rgba(35, 37, 38, 1)',
						'rgba(58, 58, 92, 1)',
						'rgba(92, 34, 58, 1)',
						'rgba(26, 26, 46, 1)',
						'rgba(178, 0, 0, 1)',
						'rgba(34, 40, 49, 1)'
					],
					borderWidth: 1
				}
			],
		};

		const config = {
			type: "bar",
			data: dados,
			options: {
				responsive: true,
				plugins: {
					legend: {
						labels: {
							color: "#fff"
						}
					}
				},
				scales: {
					x: {
						ticks: { color: "#fff" },
						grid: { color: "#444" }
					},
					y: {
						beginAtZero: true,
						ticks: { color: "#fff" },
						grid: { color: "#444" }
					}
				}
			}
		};

		new Chart(
			document.getElementById("graficoTipoRelato"),
			config
		);
	}

	function plotarGraficoUrgencia(relatos) {
		// Conta relatos por urgência (usando o campo correto: nivel)
		const contagemPorUrgencia = {};
		relatos.forEach((item) => {
			const urgencia = item.nivel || "Não Informada";
			if (!contagemPorUrgencia[urgencia]) {
				contagemPorUrgencia[urgencia] = 0;
			}
			contagemPorUrgencia[urgencia]++;
		});

		const labels = Object.keys(contagemPorUrgencia);
		const data = Object.values(contagemPorUrgencia);

		const cores = [
			'rgba(178, 0, 0, 0.85)',    
			'rgba(58, 58, 92, 0.85)',   
			'rgba(35, 37, 38, 0.85)',   
			'rgba(34, 40, 49, 0.85)',   			
			'rgba(26, 26, 46, 0.85)'    
		];

		const dados = {
			labels: labels,
			datasets: [
				{
					label: "Relatos por Urgência",
					data: data,
					backgroundColor: cores,
					borderColor: [
						'rgba(178, 0, 0, 1)',    
						'rgba(58, 58, 92, 1)',   
						'rgba(35, 37, 38, 1)',   
						'rgba(34, 40, 49, 1)',   			
						'rgba(26, 26, 46, 1)'    
					],
					borderWidth: 1
				}
			],
		};

		const config = {
			type: "doughnut",
			data: dados,
			options: {
				responsive: true,
				plugins: {
					legend: {
						position: 'bottom',
						labels: {
							color: "#fff"
						}
					}
				}
			}
		};

		new Chart(
			document.getElementById("graficoUrgenciaRelato"),
			config
		);
	}
</script>

<style>
	.graficos-container {
		display: flex;
		flex-wrap: wrap;
		gap: 24px;
		justify-content: center;
	}

	.graph {
		width: 350px;
		height: 300px;
		background: #222;
		border-radius: 12px;
		padding: 16px;
		box-sizing: border-box;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.graph canvas {
		width: 100% !important;
		height: 100% !important;
		max-width: 100%;
		max-height: 100%;
	}

	.kpis {
		display: flex;
		justify-content: center;
		gap: 40px;
		margin: 30px 0 10px 0;
	}
	.kpi {
		background: #222;
		border-radius: 10px;
		padding: 18px 32px;
		box-shadow: 0 2px 10px rgba(178, 0, 0, 0.15);
		display: flex;
		flex-direction: column;
		align-items: center;
		min-width: 150px;
	}
	.kpi-label {
		font-size: 1.1rem;
		color: #b20000;
		font-family: "Special Elite", cursive;
		margin-bottom: 8px;
		text-align: center;
	}
	.kpi-value {
		font-size: 2.2rem;
		font-weight: bold;
		color: #fff;
		text-shadow: 1px 1px 2px #000;
		text-align: center;
	}
</style>
